<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merci — Salvador Cuevas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #faf9f7; color: #1a1a1a;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.5rem; text-align: center;
    }
    .merci { max-width: 640px; }
    .kicker {
      font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: #999; margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2.6rem; font-weight: 200; letter-spacing: 0.04em;
      line-height: 1.2; margin-bottom: 1.5rem;
    }
    p.lead {
      font-size: 1.1rem; color: #555; font-style: italic;
      max-width: 520px; margin: 0 auto 2.5rem; line-height: 1.7;
    }
    .signature {
      font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; color: #777;
    }
  </style>
</head>
<body>
  <div class="merci">
    <p class="kicker">— Fin de session —</p>
    <h1>Merci pour votre visite.</h1>
    <p class="lead">
      Votre brief est bien reçu. Merci.
    </p>
    <p class="signature">À très vite — Salvador Cuevas · Direction artistique &amp; image</p>
  </div>
</body>
</html>
